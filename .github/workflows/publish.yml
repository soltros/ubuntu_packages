name: Publish signed APT repository
on:
  workflow_run:
    workflows: [Build Ubuntu packages, Build optimized xemu]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build Ubuntu packages run ID (blank to refresh existing packages)'
        required: false
  schedule:
    - cron: '42 9 * * 0'
permissions:
  contents: write
  actions: read
concurrency:
  group: apt-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # Never check out or execute code from the workflow_run's source branch.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require repository signing configuration
        env:
          SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          KEY_ID: ${{ vars.APT_SIGNING_KEY_ID }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$KEY_ID" || {
            echo 'Run scripts/setup-signing.sh once from a machine with gh authenticated.'
            exit 1
          }
          install -d -m 700 "$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          printf '%s\n' "$SIGNING_KEY" | gpg --homedir "$RUNNER_TEMP/gnupg" --batch --import
      - name: Assemble packages and sign indexes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY_ID: ${{ vars.APT_SIGNING_KEY_ID }}
          BUILD_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          # Reject manually supplied artifacts from other workflows or untrusted PRs.
          if [ -n "$BUILD_RUN" ]; then
            gh api "repos/$REPO/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/run.json"
            python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/run.json'))
          assert r['conclusion']=='success' and r['event'] in ['push','workflow_dispatch']
          assert r['head_branch']=='main' and r['head_repository']['full_name']==os.environ['REPO']
          assert r['path'] in ['.github/workflows/build.yml','.github/workflows/xemu-perf.yml']
          PY
            workflow=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/run.json"))["path"].split("/")[-1])')
            mode=full
            pattern='debs-*'
            if [ "$workflow" = xemu-perf.yml ]; then
              mode=xemu-perf
              pattern=debs-stonking-xemu-perf
            fi
            count=$(gh api "repos/$REPO/actions/runs/$BUILD_RUN/artifacts" --jq '.total_count')
            if [ "$count" = 0 ]; then
              echo 'No packages built (workflow-only validation); leaving signed APT unchanged.'
              exit 0
            fi
            gh run download "$BUILD_RUN" --repo "$REPO" --pattern "$pattern" --dir incoming
          fi
          for suite in stonking; do
            mkdir -p "repo-$suite"
            # A refresh reuses the last successful published snapshot; failed builds
            # never replace working packages or publish only half a migration.
            if gh release view "apt-$suite" --repo "$REPO" > /dev/null 2>&1; then
              gh release download "apt-$suite" --repo "$REPO" --pattern '*.deb' --dir "repo-$suite"
            fi
            if [ -n "$BUILD_RUN" ]; then
              python3 experiments/xemu/merge_repo.py "repo-$suite" incoming --mode "$mode"
            fi
            python3 experiments/publishing/reuse_artifacts.py "repo-$suite"
            python3 scripts/verify-native.py "repo-$suite/"*.deb
            python3 scripts/repository.py "repo-$suite" --suite "$suite" --key "$KEY_ID"
            if ! gh release view "apt-$suite" --repo "$REPO" > /dev/null 2>&1; then
              gh release create "apt-$suite" --repo "$REPO" --title "Soltros Ubuntu — $suite" --notes "Signed APT repository for Ubuntu $suite. See README for installation."
            fi
            # Upload packages and indexes before InRelease, which is the trust root.
            gh release upload "apt-$suite" --repo "$REPO" "repo-$suite/"*.deb "repo-$suite/Packages" "repo-$suite/Packages.gz" "repo-$suite/Release" "repo-$suite/Release.gpg" "repo-$suite/soltros-archive-keyring.asc" "repo-$suite/SHA256SUMS" --clobber
            gh release upload "apt-$suite" --repo "$REPO" "repo-$suite/InRelease" --clobber
          done
      - name: Remove imported private signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"
