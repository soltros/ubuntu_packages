name: Synchronize package documentation
on:
  push:
    branches: [main]
    paths: ['packages.json', 'experiments/**/package.json', 'scripts/suites.json', 'README.md', 'docs/**', '.github/workflows/package-docs.yml']
  pull_request:
    paths: ['packages.json', 'experiments/**/package.json', 'scripts/suites.json', 'README.md', 'docs/**', '.github/workflows/package-docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s docs -v
      - run: python3 docs/package-list.py --check
  synchronize:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate and commit current catalogue
        run: |
          python3 -m unittest discover -s docs -v
          python3 docs/package-list.py
          python3 docs/package-list.py --check
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: synchronize package catalogue from definitions'
          git push origin HEAD:main
