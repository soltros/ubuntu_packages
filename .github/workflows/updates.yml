name: Check upstream updates
on:
  push:
    branches: [main]
    paths: ['packages.json', 'scripts/check-updates.py', 'scripts/check-publication.py', 'tests/test_vendor_debs.py', '.github/workflows/updates.yml']
  workflow_run:
    workflows: [Publish signed APT repository]
    types: [completed]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: update-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate vendor update tracking
        run: python3 -m unittest discover -s tests -p test_vendor_debs.py -v
      - name: Check pinned packages
        id: scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-updates.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: update-report.*
      - name: Check publication of pinned packages
        id: publication
        run: python3 scripts/check-publication.py
      - name: Maintain one update issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ATTENTION: ${{ steps.scan.outputs.attention }}
          PUBLISHED: ${{ steps.publication.outputs.ready }}
        run: |
          set -euo pipefail
          # Search all states to reuse the original issue rather than create duplicates.
          issue=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "Ubuntu package updates") | .number] | sort | .[0] // empty')
          if [ -z "$issue" ]; then
            issue=$(gh issue list --repo "$REPO" --state closed --limit 100 --json number,title \
              --jq '[.[] | select(.title == "Ubuntu package updates") | .number] | sort | last // empty')
          fi
          # An absent output on scanner failure must never be interpreted as 'current'.
          if [ "$ATTENTION" != false ] || [ "$PUBLISHED" != true ]; then
            if [ "$ATTENTION" = false ]; then
              printf '\\nPins are current, but awaiting confirmed publication in BOTH 26.04 and 26.10.\\n' >> update-report.md
            fi
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --repo "$REPO" --body-file update-report.md --add-assignee soltros
              gh issue reopen "$issue" --repo "$REPO" || test "$(gh issue view "$issue" --repo "$REPO" --json state --jq .state)" = OPEN
            else
              gh issue create --repo "$REPO" --title 'Ubuntu package updates' --body-file update-report.md --assignee soltros
            fi
          elif [ -n "$issue" ]; then
            # Refresh stale report BEFORE closing, so the body never lists old updates.
            gh issue edit "$issue" --repo "$REPO" --body-file update-report.md
            if [ "$(gh issue view "$issue" --repo "$REPO" --json state --jq .state)" = OPEN ]; then
              gh issue close "$issue" --repo "$REPO" --reason completed
            fi
          fi
      - name: Report scanner failures
        if: steps.scan.outcome == 'failure'
        run: exit 1
